# Copy to config.yml and replace T27 with a local physical GR channel.
server:
  addrs:
    - http: '0.0.0.0:40772'
epg:
  cache-dir: /var/lib/mirakc/epg
channels:
  - name: GR-T27-example
    type: GR
    channel: 'T27'
tuners:
  - name: PIX-DT295-GR
    types: [GR]
    command: >-
      /usr/local/bin/pix-mirakc-tuner
      --type {{{channel_type}}}
      --channel {{{channel}}}
      --duration {{{duration}}}
      --instance dt295
      --runtime-dir /run/pixd
      --group
    # pixd uses the card inserted in the DT295 during capture.  The tuner
    # command is expected to emit clear PES, subject to real-device validation.
    decoded: true
filters:
  # The built-in card is not a PC/SC reader.  Do not pass this stream through
  # the external B25/pcscd proxy used by other tuners.
  decode-filter:
    command: ''
